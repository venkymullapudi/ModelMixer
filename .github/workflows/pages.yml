name: Deploy to GitHub Pages

# Publishes the single-file build (dist/modelmixer.html) as the site's index page,
# so recipe links (…/#r=…) can be shared as https URLs.
# One-time setup by the repo owner: Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build single-file app
        run: |
          python3 scripts/bundle.py
          mkdir -p _site/docs
          cp dist/modelmixer.html _site/index.html
          cp dist/modelmixer.html _site/modelmixer.html
          cp -r docs/screenshots _site/docs/ 2>/dev/null || true
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
