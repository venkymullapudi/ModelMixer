name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Engine tests
        run: node tests/run.js
      - name: Atlas transfer snapshot matches the engine
        run: python3 scripts/transfer_snapshot.py --check
      - name: Bundle is up to date
        run: |
          python3 scripts/bundle.py
          git diff --exit-code dist/ || (echo "dist/modelmixer.html is stale: run python3 scripts/bundle.py and commit" && exit 1)

  browser:
    # accessibility (axe-core, every view), keyboard-only use and phone layout (375 px) can't silently regress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Build
        run: python3 scripts/bundle.py
      - name: Accessibility audit (axe-core)
        run: python3 scripts/axe_audit.py
        env:
          PW_CHANNEL: ''
      - name: Keyboard-only flow (Tab / arrows / Enter / Esc)
        run: python3 scripts/keyboard_audit.py
        env:
          PW_CHANNEL: ''
      - name: Phone layout audit (375 px)
        run: python3 scripts/phone_audit.py . phone-shots
        env:
          PW_CHANNEL: ''
      - name: Keep phone screenshots if the audit failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phone-shots
          path: phone-shots
