name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Engine tests
        run: node tests/run.js
      - name: Bundle is up to date
        run: |
          python3 scripts/bundle.py
          git diff --exit-code dist/ || (echo "dist/modelmixer.html is stale: run python3 scripts/bundle.py and commit" && exit 1)
